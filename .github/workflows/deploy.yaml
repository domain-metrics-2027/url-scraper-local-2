name: Build and Deploy URL Scraper

# Push to main → image on Docker Hub → StatefulSet rolled in the cluster.
# Same secrets as the other article-innovator services (DOCKER_*, AWS_*,
# EKS_CLUSTER_NAME).
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - scraper.py
      - k8s/**
      - .github/workflows/deploy.yaml
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  NAMESPACE: article-innovator

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE=${{ secrets.DOCKER_USERNAME }}/url-scraper" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Connect to the cluster
        run: aws eks update-kubeconfig --name "${{ secrets.EKS_CLUSTER_NAME }}" --region "$AWS_REGION"

      - name: Image pull secret
        run: |
          kubectl create secret docker-registry url-scraper-image-pull-secret \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username="${{ secrets.DOCKER_USERNAME }}" \
            --docker-password="${{ secrets.DOCKER_PASSWORD }}" \
            --namespace="$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy
        run: |
          kubectl apply -f k8s/url-scraper.yaml
          kubectl -n "$NAMESPACE" set image statefulset/url-scraper url-scraper="$IMAGE:${{ github.sha }}"
          kubectl -n "$NAMESPACE" rollout status statefulset/url-scraper --timeout=15m
          kubectl -n "$NAMESPACE" get pods -l app=url-scraper -o wide
